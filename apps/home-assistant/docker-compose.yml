services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    privileged: true
    volumes:
      - homeassistant_config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    deploy:
      resources:
        limits:
          memory: 2gb
    ports:
      - "192.168.2.251:80:8123"
      - "6666:6666/udp"
      - "6667:6667/udp"
    environment:
      - TZ=Europe/Amsterdam
    restart: unless-stopped

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:latest
    deploy:
      resources:
        limits:
          memory: 125M
    environment:
      - TZ=Europe/Amsterdam
    volumes:
      - ./mosquitto-data/conf:/mosquitto/conf
      - ./mosquitto-data/data:/mosquitto/data
      - ./mosquitto-data/log:/mosquitto/log
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    command: "mosquitto -c /mosquitto-no-auth.conf"
    depends_on:
      - homeassistant

  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt:latest
    volumes:
      - ./zigbee2mqtt-data:/app/data
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
    environment:
      - TZ=Europe/Amsterdam
    ports:
      - "8124:8124"
      - "8125:8080"
    restart: unless-stopped
    depends_on:
      - mosquitto

  cloudflaretunnel:
    container_name: cloudflare-tunnel
    image: cloudflare/cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=$TUNNEL_TOKEN
      - TUNNEL_MANAGEMENT_DIAGNOSTICS=false

  faster-whisper:
    image: rhasspy/wyoming-whisper:latest
    container_name: faster-whisper
    environment:
      - TZ=Etc/Amsterdam
    volumes:
      - whisper_config:/config
    ports:
      - 10300:10300
    restart: unless-stopped
    command: [ "--model", "tiny-int8", "--language", "nl" ]

  piper:
    image: ghcr.io/linuxserver/piper:latest
    container_name: piper
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/Amsterdam
      - PIPER_VOICE=nl_NL-mls_5809-low
    volumes:
      - piper_config:/config
    ports:
      - 10200:10200
    restart: unless-stopped

  azure-stt-service:
    container_name: azure-stt-service
    image: ghcr.io/hugobloem/wyoming-microsoft-stt-noha:latest
    ports:
      - 10301:10301
    environment:
      - AZURE_SERVICE_REGION=northeurope
      - AZURE_SUBSCRIPTION_KEY=$AZURE_STT_KEY
    restart: unless-stopped
    command: --uri=tcp://0.0.0.0:10301 --language=nl-NL --profanity=off

  azure-tts-service:
    container_name: azure-tts-service
    image: ghcr.io/hugobloem/wyoming-microsoft-tts-noha:latest
    ports:
      - 10201:10200
    environment:
      - AZURE_SERVICE_REGION=northeurope
      - AZURE_SUBSCRIPTION_KEY=$AZURE_STT_KEY
    restart: unless-stopped
    command: --uri=tcp://0.0.0.0:10200 --voice=nl-NL-MaartenNeural

  esphome:
    image: ghcr.io/esphome/esphome
    container_name: esphome
    volumes:
      - ./esp_home:/config
    network_mode: host

  frigate:
    container_name: frigate
    privileged: true # this may not be necessary for all setups
    restart: unless-stopped
    stop_grace_period: 30s # allow enough time to shut down the various services
    image: ghcr.io/blakeblackshear/frigate:stable
    shm_size: "512mb" # update for your cameras based on calculation above
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128 # For intel hwaccel, needs to be updated for your hardware
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./frigate/config:/config
      - ./frigate/media:/media/frigate
      - type: tmpfs # Optional: 1GB of memory, reduces SSD/SD Card wear
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "8971:8971"
      - "6050:5000" # Internal unauthenticated access. Expose carefully.
      - "8554:8554" # RTSP feeds
      - "8555:8555/tcp" # WebRTC over tcp
      - "8555:8555/udp" # WebRTC over udp
    environment:
      FRIGATE_RTSP_PASSWORD: "password"

networks:
  default:
    driver: bridge

volumes:
  homeassistant_config:
  whisper_config:
  piper_config:
  openwakeword_data:


