# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  # themes: !include_dir_merge_named themes
  extra_module_url:
    - /hacsfiles/lovelace-card-mod/card-mod.js

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

alarm_control_panel:
  - platform: manual
    name: Alarm
    arming_time: 10
    code_arm_required: false

notify:
  - platform: group
    name: "Everyone"
    services:
      - service: mobile_app_x1_android
      - service: mobile_app_x2_android
      - service: mobile_app_tablet

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.20.0.1
  ip_ban_enabled: true
  login_attempts_threshold: 50

template:
  - light:
    - turn_on:
      - target:
          entity_id:
          - light.woonkamer_groep
        action: light.turn_on
      turn_off:
      - target:
          entity_id:
          - light.woonkamer_groep
        action: light.turn_off
      set_level:
      - variables:
          group: light.woonkamer_groep
          on_with_br: "{{\n  expand(group) \n    | selectattr('attributes.brightness',
            'defined')\n    | selectattr('attributes.brightness')\n    | map(attribute='entity_id')\n
            \   | list\n}}"
      - if:
        - value_template: '{{ on_with_br | count > 0 or is_state(group, ''off'') }}'
          condition: template
        then:
        - target:
            entity_id: '{{ on_with_br or group }}'
          data:
            brightness: '{{ brightness }}'
          action: light.turn_on
      default_entity_id: light.template_woonkamer_lampen
      name: Template Woonkamer lampen
      level: "{% set group = 'light.woonkamer_groep' %} {{\n  expand(group) \n    |
        selectattr('attributes.brightness', 'defined')\n    | selectattr('attributes.brightness')\n
        \   | map(attribute='attributes.brightness')\n    | average(default=0)\n}}"
      state: '{{ is_state(''light.woonkamer_groep'', ''on'') }}'

