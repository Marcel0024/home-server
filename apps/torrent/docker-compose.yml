# all ports of the services are via Gluetun. Ports are defined in ../vpn

services:
  sabnzbd:
    container_name: sabnzbd
    image: ghcr.io/hotio/sabnzbd:latest
    network_mode: "container:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
      - HAS_IPV6=false
    volumes:
      - sabnzbd_config:/config
      - $MEDIA_LOCATION/usenet:/config/Downloads/complete
      - $MEDIA_LOCATION/usenet/incomplete:/config/Downloads/incomplete
    restart: unless-stopped

  qbittorrent:
    image: ghcr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "container:gluetun"
    deploy:
      resources:
        limits:
          memory: 3g
    environment:
      - TZ=Europe/Amsterdam
      - WEBUI_PORT=8081
      - PUID=1000
      - PGID=1000
    volumes:
      - qbittorrent_config:/config
      - $MEDIA_LOCATION/torrents:/downloads
    restart: unless-stopped

  prowlarr:
    image: ghcr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "container:gluetun"
    environment:
      - TZ=Europe/Amsterdam
      - PUID=1000
      - PGID=1000
    volumes:
      - prowlarr_config:/config
    restart: unless-stopped

  radarr:
    image: ghcr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: "container:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
    volumes:
      - radarr_config:/config
      - radarr_downloads:/downloads
      - $MEDIA_LOCATION:/movies
    depends_on:
      - prowlarr
    restart: unless-stopped

  sonarr:
    image: ghcr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: "container:gluetun"
    environment:
      - TZ=Europe/Amsterdam
      - PUID=1000
      - PGID=1000
    volumes:
      - sonarr_config:/config
      - sonarr_downloads:/downloads
      - $MEDIA_LOCATION:/tv
    depends_on:
      - prowlarr
    restart: unless-stopped

  jellyseerr:
    image: ghcr.io/fallenbagel/jellyseerr:latest
    container_name: jellyseerr 
    init: true 
    network_mode: "container:gluetun"
    environment:
      - TZ=Europe/Amsterdam
    volumes:
      - jellyseerr_config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3  
    restart: unless-stopped

volumes:
  qbittorrent_config:
  prowlarr_config:
  radarr_config:
  radarr_downloads:
  sonarr_config:
  sonarr_downloads:
  readarr_config:
  readarr_books:
  overseerr_config:
  jellyseerr_config:
  sabnzbd_config:
