services:
  azure-build-agent1:
    container_name: azure-build-agent1
    build:
      context: ./apps/azure-build-agent
      dockerfile: agent.dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add: # getent group docker | cut -d: -f3
      - 999             
    labels: [ "wud.watch=false" ]
    deploy:
      resources:
        limits:
          cpus: "6"  
    restart: no
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AZP_URL=$AZP_URL
      - AZP_TOKEN=$AZP_TOKEN
      - AZP_AGENT_NAME=$AZP_AGENT_NAME Container 1
      - AZP_POOL=$AZP_POOL

  azure-build-agent2:
    container_name: azure-build-agent2
    build:
      context: ./apps/azure-build-agent
      dockerfile: agent.dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   
    group_add: # getent group docker | cut -d: -f3
      - 999               
    deploy:
      resources:
        limits:
          cpus: "6"
    labels: [ "wud.watch=false" ]
    restart: no
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AZP_URL=$AZP_URL
      - AZP_TOKEN=$AZP_TOKEN
      - AZP_AGENT_NAME=$AZP_AGENT_NAME Container 2
      - AZP_POOL=$AZP_POOL
